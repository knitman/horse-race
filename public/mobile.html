<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="/socket.io/socket.io.js"></script>
<style>
body{font-family:Arial;text-align:center}
button{width:80px;height:80px;margin:10px;font-size:20px}
#circles button{opacity:0.4}
#circles button.enabled{opacity:1}
</style>
</head>
<body>

<h2 id="status">Διάλεξε χρώμα</h2>
<div id="colors"></div>
<button id="ready" style="display:none">ΕΤΟΙΜΟΣ</button>
<div id="circles"></div>

<script>
const socket=io();
const colors=["red","blue","yellow","green","purple","orange"];

let myColor=null;
let myTurn=false;

colors.forEach(c=>{
 let b=document.createElement("button");
 b.style.background=c;
 b.onclick=()=>socket.emit("choose_color",c);
 document.getElementById("colors").appendChild(b);
});

socket.on("color_ok",()=>{
 myColor = event?.target?.style?.background || myColor;
 document.getElementById("ready").style.display="block";
});

socket.on("color_taken",()=>alert("Το πήρε άλλος"));

document.getElementById("ready").onclick=()=>{
 socket.emit("player_ready");
};

// 👉 Όταν αλλάζει η σειρά
socket.on("start_turn",(color)=>{
 myTurn = (color === myColor);

 document.getElementById("status").innerText =
   myTurn ? "Η σειρά σου!" : "Περίμενε τη σειρά σου";

 renderCircles();
});

function renderCircles(){
 const div=document.getElementById("circles");
 div.innerHTML="";

 for(let i=0;i<6;i++){
   let b=document.createElement("button");
   b.innerText="?";

   if(myTurn){
     b.classList.add("enabled");
     b.onclick=()=>{
        myTurn=false;     // κλειδώνει αμέσως
        renderCircles();
        socket.emit("pick_circle",i);
     };
   }

   div.appendChild(b);
 }
}

socket.on("reveal_number",(n)=>{
 document.getElementById("status").innerText="Έβγαλες "+n;
});
</script>

</body>
</html>
