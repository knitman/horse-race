<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<style>
body{margin:0;overflow:hidden;background:#1e5b2a;font-family:Arial}

/* Overlay για κλήρωση & νικητή */
#overlay{
 position:fixed;inset:0;background:black;color:white;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:60px;z-index:10;display:none;text-align:center
}

/* ΚΕΝΤΡΙΚΗ ΜΠΑΡΑ ΣΕΙΡΑΣ */
#turnBar{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 background:rgba(0,0,0,0.85);
 color:white;
 padding:30px 60px;
 border-radius:14px;
 font-size:64px;
 z-index:9;
 display:none;
}

/* QR */
#qrBox{
 position:fixed; top:16px; right:16px;
 background:white; padding:8px; border-radius:8px; z-index:5;
}
#qrBox img{ width:110px; height:110px; display:block; }

/* Status */
#statusBox{
 position:fixed; top:16px; left:16px;
 background:rgba(0,0,0,0.6);
 color:white; padding:10px 14px;
 border-radius:8px; z-index:5;
 font-size:18px; line-height:1.4;
}
#startBtn{
 margin-top:8px;
 padding:6px 10px;
 font-size:16px;
 cursor:pointer;
}
</style>
</head>
<body>

<div id="overlay"></div>
<div id="turnBar"></div>

<!-- QR -->
<div id="qrBox">
  <img id="qrImg">
</div>

<!-- STATUS / START -->
<div id="statusBox">
  Παίκτες: <span id="pCount">0</span><br>
  Έτοιμοι: <span id="rCount">0</span><br>
  <button id="startBtn">START</button>
</div>

<script>
const socket = io();
socket.emit("i_am_board"); // 👈 πολύ σημαντικό

let sceneRef;
const STEP_PX = 13;

// QR
const mobileURL = window.location.origin + "/mobile.html";
document.getElementById("qrImg").src =
  "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(mobileURL);

// Ήχοι SFX
const sounds = {
    beep: new Audio("beep.mp3"),
    gallop: new Audio("gallop.mp3"),
    tick: new Audio("tick.mp3"),
    win: new Audio("win.mp3")
};
function play(n){ sounds[n].currentTime=0; sounds[n].play(); }

// 🎵 Background music
const bgMusic = new Audio("bg.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.25;
document.body.addEventListener("click", ()=>{
    bgMusic.play().catch(()=>{});
}, { once:true });

class BoardScene extends Phaser.Scene{
    constructor(){ super("board"); }
    preload(){ this.load.image("horse","horse.png"); }

    create(){
        sceneRef = this;
        this.startX = 140;
        this.lanesY = [190,270,350,430,510,590];
        this.horses = {};
        this.drawBase();
    }

    drawBase(){
        this.cameras.main.setBackgroundColor("#1e5b2a");
        this.lanesY.forEach((y)=>{
            let g=this.add.graphics();
            g.fillStyle(0xc9a36a);
            g.fillRect(100,y-35,980,70);
        });
    }

    revealLanes(order){
        document.getElementById("qrBox").style.display="none";
        document.getElementById("statusBox").style.display="none";

        const map={
            red:0xff6b6b, blue:0x4d96ff, yellow:0xffe66d,
            green:0x6bff95, purple:0xd96bff, orange:0xffa94d
        };

        order.forEach((color,i)=>{
            let y=this.lanesY[i];
            let g=this.add.graphics();
            g.fillStyle(map[color]);
            g.fillRect(100,y-35,980,70);
            let horse=this.add.image(this.startX,y,"horse").setScale(0.09);
            this.horses[color]=horse;
        });
    }

    moveHorse(color,steps){
        let horse=this.horses[color];
        play("gallop");

        this.tweens.add({
            targets:horse,
            x:horse.x + steps*STEP_PX,
            duration:400,
            onComplete: ()=> socket.emit("animation_done",color)
        });

        const txt = this.add.text(horse.x, horse.y-40, "+"+steps, {
            font:"48px Arial", color:"#fff",
            stroke:"#000", strokeThickness:6
        }).setOrigin(0.5);

        play("tick");

        this.tweens.add({
            targets: txt,
            y: horse.y - 80,
            alpha: 0,
            duration: 3000,
            onComplete: ()=> txt.destroy()
        });
    }

    resetBoard(){ location.reload(); }
}

new Phaser.Game({
    type:Phaser.AUTO,
    width:1200,
    height:720,
    scene:BoardScene
});
</script>

<script>
const overlay=document.getElementById("overlay");
const turnBar=document.getElementById("turnBar");

// Μετρητές
socket.on("update_players",(players)=>{
    const total = Object.keys(players).length;
    const ready = Object.values(players).filter(p=>p.ready).length;
    document.getElementById("pCount").innerText = total;
    document.getElementById("rCount").innerText = ready;
});

// START
document.getElementById("startBtn").onclick = ()=>{
    socket.emit("start_game");
};

// Κλήρωση
socket.on("reveal_order",(order)=>{
    overlay.style.display="flex";
    overlay.innerHTML="<h1>ΚΛΗΡΩΣΗ ΣΕΙΡΑΣ</h1>";
    order.forEach((c,i)=>{
        let d=document.createElement("div");
        d.innerText=`${i+1}ος: ${c}`;
        overlay.appendChild(d);
    });

    setTimeout(()=>{
        overlay.style.display="none";
        sceneRef.revealLanes(order);
    },4000);
});

// Μπάρα σειράς
socket.on("start_turn",(color)=>{
    play("beep");
    turnBar.innerText = `ΠΑΙΖΕΙ ΤΩΡΑ: ${color.toUpperCase()}`;
    turnBar.style.display="block";
    setTimeout(()=> turnBar.style.display="none", 2000);
});

socket.on("move_horse",({color,steps})=>{
    sceneRef.moveHorse(color,steps);
});

socket.on("winner",(color)=>{
    play("win");
    overlay.style.display="flex";
    overlay.innerHTML=`🏆 ΝΙΚΗΤΗΣ: ${color.toUpperCase()}`;
});

socket.on("reset_board",()=>{
    location.reload();
});
</script>

</body>
</html>
